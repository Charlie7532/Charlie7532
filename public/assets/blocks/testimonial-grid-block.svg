<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#fafafa"/>
  
  <!-- Title and description -->
  <text x="200" y="30" text-anchor="middle" fill="#1d1d1f" font-size="16" font-weight="700" font-family="-apple-system, Helvetica, sans-serif">Lorem Ipsum</text>
  <text x="200" y="50" text-anchor="middle" fill="#86868b" font-size="10" font-family="-apple-system, Helvetica, sans-serif">Lorem ipsum dolor sit amet consectetur</text>
  
  <!-- Card 1 -->
  <rect x="20" y="70" width="110" height="200" rx="8" fill="#fff" stroke="#e5e5e7" stroke-width="2"/>
  <!-- Quote icon -->
  <text x="35" y="100" fill="#1d1d1f" font-size="20" font-weight="600" font-family="Georgia, serif" opacity="0.2">"</text>
  <!-- Quote text -->
  <text x="75" y="100" text-anchor="middle" fill="#1d1d1f" font-size="8" font-weight="400" font-family="-apple-system, Helvetica, sans-serif">Lorem ipsum dolor</text>
  <text x="75" y="112" text-anchor="middle" fill="#1d1d1f" font-size="8" font-weight="400" font-family="-apple-system, Helvetica, sans-serif">sit amet</text>
  <text x="75" y="124" text-anchor="middle" fill="#1d1d1f" font-size="8" font-weight="400" font-family="-apple-system, Helvetica, sans-serif">consectetur</text>
  <!-- Divider -->
