  <!-- Avatar -->
  <circle cx="42" cy="245" r="12" fill="#e8e8ed"/>
  <text x="42" y="250" text-anchor="middle" fill="#86868b" font-size="8" font-weight="600" font-family="-apple-system, Helvetica, sans-serif">JD</text>
  <!-- Author info -->
