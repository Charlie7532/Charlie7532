<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#fafafa"/>
  <!-- Card Container with border -->
  <rect x="30" y="30" width="340" height="190" rx="12" fill="#fff" stroke="#e5e5e7" stroke-width="2"/>
  <!-- Quote marks -->
  <text x="60" y="90" fill="#1d1d1f" font-size="40" font-weight="600" font-family="Georgia, serif" opacity="0.2">"</text>
  <!-- Quote text -->
  <text x="200" y="85" text-anchor="middle" fill="#1d1d1f" font-size="14" font-weight="500" font-family="-apple-system, Helvetica, sans-serif">Lorem ipsum dolor sit amet,</text>
  <text x="200" y="105" text-anchor="middle" fill="#1d1d1f" font-size="14" font-weight="500" font-family="-apple-system, Helvetica, sans-serif">consectetur adipiscing elit</text>
  <!-- Closing quote -->
  <text x="325" y="115" fill="#1d1d1f" font-size="40" font-weight="600" font-family="Georgia, serif" opacity="0.2">"</text>
  <!-- Divider line -->
  <line x1="150" y1="135" x2="250" y2="135" stroke="#e5e5e7" stroke-width="1"/>
  <!-- Avatar circle -->
  <circle cx="170" cy="170" r="20" fill="#e8e8ed"/>
  <!-- Initials in avatar -->
  <text x="170" y="177" text-anchor="middle" fill="#86868b" font-size="14" font-weight="600" font-family="-apple-system, Helvetica, sans-serif">JD</text>
  <!-- Author name -->
  <text x="200" y="168" fill="#1d1d1f" font-size="11" font-weight="600" font-family="-apple-system, Helvetica, sans-serif">John Doe</text>
  <!-- Author role/company -->
  <text x="200" y="183" fill="#86868b" font-size="9" font-family="-apple-system, Helvetica, sans-serif">CEO, Company Inc.</text>
</svg>
