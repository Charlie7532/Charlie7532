<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#fafafa"/>
  
  <!-- Left Column: Content -->
  <!-- Badge -->
  <rect x="20" y="20" width="60" height="14" rx="7" fill="#fff" stroke="#e8e8ed" stroke-width="1"/>
  <text x="50" y="29" text-anchor="middle" fill="#86868b" font-size="7" font-weight="500" letter-spacing="1" font-family="-apple-system, Helvetica, sans-serif">PLATFORM</text>
  
  <!-- Title -->
  <text x="20" y="50" fill="#1d1d1f" font-size="14" font-weight="700" font-family="-apple-system, Helvetica, sans-serif">Feature Highlights</text>
  
  <!-- Subtitle -->
  <text x="20" y="65" fill="#86868b" font-size="7" font-family="-apple-system, Helvetica, sans-serif">Showcase your key features</text>
  <text x="20" y="74" fill="#86868b" font-size="7" font-family="-apple-system, Helvetica, sans-serif">with checkmarks and details</text>
  
  <!-- Feature 1 -->
  <circle cx="25" cy="100" r="6" fill="#e8e8ed"/>
  <path d="M 23.5 100 L 24.5 101 L 26.5 99" stroke="#1d1d1f" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="37" y="102" fill="#1d1d1f" font-size="8" font-weight="600" font-family="-apple-system, Helvetica, sans-serif">Lorem Ipsum</text>
  <text x="37" y="110" fill="#86868b" font-size="6.5" font-family="-apple-system, Helvetica, sans-serif">Lorem ipsum dolor sit amet</text>
  
  <!-- Feature 2 -->
  <circle cx="25" cy="130" r="6" fill="#e8e8ed"/>
  <path d="M 23.5 130 L 24.5 131 L 26.5 129" stroke="#1d1d1f" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="37" y="132" fill="#1d1d1f" font-size="8" font-weight="600" font-family="-apple-system, Helvetica, sans-serif">Dolor Sit Amet</text>
  <text x="37" y="140" fill="#86868b" font-size="6.5" font-family="-apple-system, Helvetica, sans-serif">Consectetur adipiscing elit</text>
  
  <!-- Feature 3 -->
  <circle cx="25" cy="160" r="6" fill="#e8e8ed"/>
  <path d="M 23.5 160 L 24.5 161 L 26.5 159" stroke="#1d1d1f" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="37" y="162" fill="#1d1d1f" font-size="8" font-weight="600" font-family="-apple-system, Helvetica, sans-serif">Consectetur Elit</text>
  <text x="37" y="170" fill="#86868b" font-size="6.5" font-family="-apple-system, Helvetica, sans-serif">Ut enim ad minim veniam</text>
  
  <!-- Right Column: Image -->
  <rect x="210" y="20" width="170" height="170" rx="8" fill="#fff" stroke="#e8e8ed" stroke-width="1"/>
  <rect x="218" y="28" width="154" height="154" rx="6" fill="#e8e8ed"/>
  <text x="295" y="102" text-anchor="middle" fill="#86868b" font-size="9" font-weight="500" font-family="-apple-system, Helvetica, sans-serif">Optional</text>
  <text x="295" y="114" text-anchor="middle" fill="#86868b" font-size="9" font-weight="500" font-family="-apple-system, Helvetica, sans-serif">Image</text>
  
  <!-- Divider line to show columns -->
  <line x1="200" y1="15" x2="200" y2="235" stroke="#e8e8ed" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
