<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#fafafa"/>
  
  <!-- Left Column - Text Content -->
  <!-- Eyebrow -->
  <text x="30" y="44" fill="#86868b" font-size="9" font-weight="500" font-family="-apple-system, Helvetica, sans-serif">LOREM IPSUM</text>
  
  <!-- Title -->
  <text x="30" y="66" fill="#1d1d1f" font-size="16" font-weight="600" font-family="-apple-system, Helvetica, sans-serif">Lorem Ipsum</text>
  <text x="30" y="88" fill="#1d1d1f" font-size="16" font-weight="600" font-family="-apple-system, Helvetica, sans-serif">Dolor Sit Amet</text>
  
  <!-- Description -->
  <text x="30" y="114" fill="#86868b" font-size="9.5" font-family="-apple-system, Helvetica, sans-serif">Consectetur adipiscing elit, sed</text>
  <text x="30" y="128" fill="#86868b" font-size="9.5" font-family="-apple-system, Helvetica, sans-serif">do eiusmod tempor incididunt</text>
  <text x="30" y="142" fill="#86868b" font-size="9.5" font-family="-apple-system, Helvetica, sans-serif">ut labore et dolore magna.</text>
  
  <!-- CTA Button -->
  <rect x="30" y="164" width="90" height="32" rx="16" fill="#1d1d1f"/>
  <text x="75" y="185" text-anchor="middle" fill="#fff" font-size="10" font-weight="500" font-family="-apple-system, Helvetica, sans-serif">Learn More</text>
  
  <!-- Right Column - Image Placeholder -->
  <rect x="210" y="25" width="170" height="200" rx="14" fill="#e8e8ed"/>
