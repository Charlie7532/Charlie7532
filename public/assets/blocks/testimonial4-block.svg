<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#fafafa"/>
  
  <!-- Header Section -->
  <text x="30" y="35" fill="#86868b" font-size="8" font-weight="500" font-family="-apple-system, Helvetica, sans-serif" letter-spacing="1.5">TESTIMONIALS</text>
  <text x="30" y="55" fill="#1d1d1f" font-size="15" font-weight="600" font-family="-apple-system, Helvetica, sans-serif">Lorem Ipsum</text>
  
  <!-- Navigation Buttons (Top Right) -->
  <g transform="translate(330, 30)">
    <circle cx="12" cy="12" r="11" fill="#f5f5f7" stroke="#e8e8ed" stroke-width="1"/>
    <text x="12" y="16" text-anchor="middle" fill="#86868b" font-size="12" font-family="-apple-system, Helvetica, sans-serif">‹</text>
    
    <circle cx="38" cy="12" r="11" fill="#f5f5f7" stroke="#e8e8ed" stroke-width="1"/>
    <text x="38" y="16" text-anchor="middle" fill="#86868b" font-size="12" font-family="-apple-system, Helvetica, sans-serif">›</text>
  </g>
  
  <!-- First Testimonial Card -->
  <rect x="30" y="75" width="110" height="145" rx="8" fill="#fff" stroke="#e8e8ed" stroke-width="1"/>
  
  <!-- Card 1 - Image placeholder -->
  <rect x="30" y="75" width="110" height="50" rx="8" fill="#e8e8ed"/>
  
  <!-- Card 1 - Content -->
  <text x="40" y="143" fill="#1d1d1f" font-size="8" font-weight="600" font-family="-apple-system, Helvetica, sans-serif">John Doe</text>
  <text x="40" y="153" fill="#86868b" font-size="6.5" font-family="-apple-system, Helvetica, sans-serif">CEO at Company</text>
  
  <!-- Card 1 - Stars -->
  <g transform="translate(40, 160)">
    <text fill="#fbbf24" font-size="8">★★★★★</text>
  </g>
  
  <!-- Card 1 - Quote -->
  <text x="40" y="180" fill="#86868b" font-size="7" font-family="-apple-system, Helvetica, sans-serif">"Lorem ipsum dolor</text>
  <text x="40" y="189" fill="#86868b" font-size="7" font-family="-apple-system, Helvetica, sans-serif">sit amet..."</text>
  
  <!-- Second Testimonial Card -->
  <rect x="150" y="75" width="110" height="145" rx="8" fill="#fff" stroke="#e8e8ed" stroke-width="1"/>
  
  <!-- Card 2 - Image placeholder -->
  <rect x="150" y="75" width="110" height="50" rx="8" fill="#e8e8ed"/>
  
  <!-- Card 2 - Content -->
  <text x="160" y="143" fill="#1d1d1f" font-size="8" font-weight="600" font-family="-apple-system, Helvetica, sans-serif">Jane Smith</text>
  <text x="160" y="153" fill="#86868b" font-size="6.5" font-family="-apple-system, Helvetica, sans-serif">Designer</text>
  
  <!-- Card 2 - Stars -->
  <g transform="translate(160, 160)">
    <text fill="#fbbf24" font-size="8">★★★★</text>
    <text fill="#d2d2d7" font-size="8">★</text>
  </g>
  
  <!-- Card 2 - Quote -->
  <text x="160" y="180" fill="#86868b" font-size="7" font-family="-apple-system, Helvetica, sans-serif">"Consectetur</text>
  <text x="160" y="189" fill="#86868b" font-size="7" font-family="-apple-system, Helvetica, sans-serif">adipiscing..."</text>
  
  <!-- Third Testimonial Card (partial, showing scroll) -->
  <rect x="270" y="75" width="110" height="145" rx="8" fill="#fff" stroke="#e8e8ed" stroke-width="1"/>
  
  <!-- Card 3 - Image placeholder -->
  <rect x="270" y="75" width="110" height="50" rx="8" fill="#e8e8ed"/>
  
  <!-- Card 3 - Content -->
  <text x="280" y="143" fill="#1d1d1f" font-size="8" font-weight="600" font-family="-apple-system, Helvetica, sans-serif">Alex Brown</text>
  <text x="280" y="153" fill="#86868b" font-size="6.5" font-family="-apple-system, Helvetica, sans-serif">Developer</text>
  
  <!-- Card 3 - Stars -->
  <g transform="translate(280, 160)">
    <text fill="#fbbf24" font-size="8">★★★★★</text>
  </g>
  
  <!-- Card 3 - Quote -->
  <text x="280" y="180" fill="#86868b" font-size="7" font-family="-apple-system, Helvetica, sans-serif">"Sed do eiusmod</text>
  <text x="280" y="189" fill="#86868b" font-size="7" font-family="-apple-system, Helvetica, sans-serif">tempor..."</text>
  
  <!-- Fade effect on right edge to show scrollability -->
  <defs>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fafafa;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#fafafa;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="370" y="75" width="30" height="145" fill="url(#fade)"/>
</svg>
