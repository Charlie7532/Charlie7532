<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2c38"/>
      <stop offset="1" stop-color="#121c24"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28414f"/>
      <stop offset="1" stop-color="#1b2e39"/>
    </linearGradient>
  </defs>
  <rect width="640" height="800" fill="url(#bg2)"/>

  <!-- grid -->
  <g stroke="#243845" stroke-width="1" opacity="0.5">
    <path d="M0 100 H640 M0 200 H640 M0 300 H640 M0 400 H640 M0 500 H640 M0 600 H640 M0 700 H640"/>
    <path d="M80 0 V800 M160 0 V800 M240 0 V800 M320 0 V800 M400 0 V800 M480 0 V800 M560 0 V800"/>
  </g>

  <!-- connections -->
  <g stroke="#4d7f99" fill="none">
    <path d="M320 170 V250" stroke="#4d7f99" stroke-width="4"/>
    <path d="M320 350 V420 M320 350 Q200 400 160 470 M320 350 Q440 400 480 470" stroke="#4d7f99" stroke-width="4"/>
    <path d="M160 570 Q240 640 300 660 M480 570 Q400 640 340 660" stroke="#4d7f99" stroke-width="4" stroke-dasharray="8 8"/>
  </g>

  <!-- nodes -->
  <g font-family="ui-monospace, monospace" text-anchor="middle">
    <g>
      <rect x="240" y="110" width="160" height="60" rx="14" fill="url(#node)" stroke="#5f93ad" stroke-width="3"/>
      <text x="320" y="147" font-size="22" fill="#a9cddd">user</text>
    </g>
    <g>
      <rect x="230" y="250" width="180" height="100" rx="18" fill="url(#node)" stroke="#8fc3dc" stroke-width="4"/>
      <text x="320" y="292" font-size="26" fill="#cfe7f1">agent</text>
      <text x="320" y="322" font-size="15" fill="#7fa9bd">orchestrator</text>
    </g>
    <g>
      <rect x="90" y="470" width="140" height="100" rx="16" fill="url(#node)" stroke="#5f93ad" stroke-width="3"/>
      <text x="160" y="512" font-size="20" fill="#a9cddd">tools</text>
      <text x="160" y="540" font-size="14" fill="#7fa9bd">contracts</text>
    </g>
    <g>
      <rect x="250" y="420" width="140" height="100" rx="16" fill="url(#node)" stroke="#5f93ad" stroke-width="3"/>
      <text x="320" y="462" font-size="20" fill="#a9cddd">memory</text>
      <text x="320" y="490" font-size="14" fill="#7fa9bd">state</text>
    </g>
    <g>
      <rect x="410" y="470" width="140" height="100" rx="16" fill="url(#node)" stroke="#5f93ad" stroke-width="3"/>
      <text x="480" y="512" font-size="20" fill="#a9cddd">evals</text>
      <text x="480" y="540" font-size="14" fill="#7fa9bd">gates</text>
    </g>
    <g>
      <rect x="230" y="640" width="180" height="64" rx="32" fill="#1b3441" stroke="#8fc3dc" stroke-width="4"/>
      <text x="320" y="680" font-size="20" fill="#cfe7f1">ship ✓</text>
    </g>
  </g>
</svg>
